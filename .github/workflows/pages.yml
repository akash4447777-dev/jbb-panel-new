name: Deploy panel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Panel logic tests (offline mode, no server required)
        run: node test/panel.js

      - name: Postgres storage layer tests (stubbed, no DB needed)
        run: node test/pg.js

      # smoke.js boots its own isolated server, so no manual server juggling
      - name: End-to-end cloud tests (live server + real client)
        run: node test/smoke.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # the panel is split across js/*.js — without this the site loads a shell
          # with no code and every screen stays blank
          cp -R js _site/js
          # 404 fallback so deep links still load the panel
          cp index.html _site/404.html

      - name: Verify the static site is complete
        run: |
          set -e
          for f in core accounting views-people views-money views-reports boot; do
            test -s "_site/js/$f.js" || { echo "missing _site/js/$f.js"; exit 1; }
          done
          grep -q 'js/boot.js' _site/index.html
          echo "static site ok: $(ls _site/js | wc -l) scripts"

      - uses: actions/configure-pages@v4
        with:
          # Pages is not enabled on this repo yet; let the workflow turn it on
          # instead of failing with "Get Pages site failed" on first run.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages occasionally fails with a transient error even when the
      # artifact is valid (seen twice in this repo). Retry before giving up.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy once after a transient Pages failure
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail the job if both attempts failed
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "Both deploy attempts failed."
          exit 1
