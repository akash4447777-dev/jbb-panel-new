name: Deploy panel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offline mode tests (no server required)
        run: node test/offline.js

      - name: Cloud server tests
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          node test/smoke.js
          kill $SERVER_PID

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # 404 fallback so deep links still load the panel
          cp index.html _site/404.html

      - uses: actions/configure-pages@v4
        with:
          # Pages is not enabled on this repo yet; let the workflow turn it on
          # instead of failing with "Get Pages site failed" on first run.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
