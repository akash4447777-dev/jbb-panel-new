<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>JBB PANEL</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#fff;--bg:#f2f4f7;--ac:#16a34a;--acD:#15803d;--acDD:#14532d;--red:#dc2626;--warn:#d97706;--blue:#2563eb;--bd:#cbd5e1;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
small,.mu{font-size:12px;color:var(--muted)}
h1{margin:0 0 14px;font-size:22px;font-weight:800}
h2{margin:0 0 10px;font-size:15px;font-weight:800}
h3.hd{margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
section{margin-bottom:16px}
.mt{margin-top:12px}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 16px;background:linear-gradient(135deg,var(--acDD),var(--ac));color:#fff;box-shadow:0 2px 12px rgba(15,23,42,.12)}
.brand{font-size:18px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.user{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;flex-wrap:wrap;justify-content:flex-end}
.hbtn{border:1px solid rgba(255,255,255,.45);background:#fff;color:var(--acDD);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
.hbtn:active{transform:scale(.97)}

/* ---------- nav ---------- */
.nav{display:flex;gap:3px;overflow-x:auto;padding:6px 10px;position:sticky;top:47px;z-index:19;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:thin}
.nav button{border:0;background:none;padding:8px 13px;border-radius:9px;color:var(--muted);font:inherit;font-weight:650;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button i{font-style:normal;font-size:14px;opacity:.9}
.nav button.on{background:var(--acDD);color:#fff;box-shadow:0 2px 8px rgba(21,128,61,.3)}
.nav button:hover:not(.on){color:var(--acDD);background:#e8f7ed}

/* ---------- layout ---------- */
.screen{padding:14px 12px 80px;max-width:1200px;margin:0 auto;width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink);max-width:170px}
.filters select:focus,.filters input:focus{outline:2px solid #bbf7d0;border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar input{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font:inherit;background:#fff}
.bar input:focus{outline:2px solid #bbf7d0;border-color:var(--ac)}

/* ---------- cards / stats ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.stat b{display:block;font-size:19px;font-weight:800;line-height:1.15;word-break:break-word}
.stat span{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 13px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer}
.row:hover{background:#f9fbfb;border-color:#b7e4c7}
.row>div{min-width:0}
.row small{display:block;line-height:1.35}
.row .r{text-align:right;white-space:nowrap;font-weight:700}
.row b{font-weight:800}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:13px}
th{text-align:right;padding:8px 9px;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:#fbfdfe;white-space:nowrap}
th:first-child{text-align:left}
td{padding:8px 9px;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap}
td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f9fbfb}
tfoot th{background:#f8fafc;border-top:2px solid var(--line)}
.tw{overflow-x:auto;padding:0;border:0;background:none}

/* ---------- attendance grid ---------- */
.gw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.gw table{border:0;border-radius:0;font-size:12px;width:auto;min-width:100%}
.gw th,.gw td{padding:4px 5px;text-align:center}
.gw th.dc,.gw td.dc{text-align:left;position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line);min-width:130px;max-width:170px;white-space:normal}
.gw thead th.dc{background:#fbfdfe;z-index:3}
.gw td.P{background:#dcfce7;color:#15803d;font-weight:700}
.gw td.H{background:#fef3c7;color:#b45309;font-weight:700}
.gw td.A{background:#fee2e2;color:#b91c1c;font-weight:700}
.gw th.sn{background:#f1f5f9}
.gw th.tn{background:#dbeafe;color:#1d4ed8}
.gw td{cursor:pointer}
.gw tbody tr:hover td:not(.dc){background:#f8fafc}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;background:var(--ac);color:#fff;border-radius:9px;padding:8px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(22,163,74,.18)}
.btn:hover{background:var(--acD)}
.btn:active{transform:scale(.98)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--bd);box-shadow:none}
.btn.g:hover{background:#f8fafc}
.btn.red{background:var(--red)}
.btn.red:hover{background:#b91c1c}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.big{width:100%;padding:11px 14px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:flex;gap:3px}
.seg button{width:32px;height:30px;border:1px solid var(--bd);background:#fff;color:var(--muted);border-radius:7px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.seg .on{color:#fff;border-color:transparent}
.seg .P{background:var(--ok)}.seg .H{background:var(--warn)}.seg .A{background:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:#f1f5f9;color:#475569;margin:1px 2px 0 0;white-space:nowrap}
.pill.ok{background:#e7f5e8;color:#15803d}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill.wn{background:#fef3e2;color:#b45309}
.pill.info{background:#dbeafe;color:#1d4ed8}
.bar2{height:7px;background:#eef2f6;border-radius:99px;overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:var(--ac);border-radius:99px}

/* ---------- forms ---------- */
label{display:block;margin:10px 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.input,input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],input[type=time],select,textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;font:inherit;background:#fff;color:var(--ink)}
.input:focus,select:focus,textarea:focus{outline:2px solid #bbf7d0;border-color:var(--ac)}
textarea{resize:vertical;line-height:1.45}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.neg{color:var(--red)}.pos{color:var(--ok)}
.err{background:#fee2e2;color:var(--red);border-radius:8px;padding:7px 9px;margin-top:8px;font-weight:600;font-size:12.5px;display:none}
.err.on{display:block}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}

/* ---------- dialogs ---------- */
dialog{border:0;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 22px 50px rgba(15,23,42,.18),0 0 0 1px var(--line);width:min(520px,95vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(15,23,42,.42)}
dialog b.t{display:block;font-size:16px;margin-bottom:4px}
dialog h2{margin-top:0}

/* ---------- login ---------- */
.login-wrap{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#14532d,#16a34a 60%,#22c55e)}
.login-card{width:min(400px,100%);background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.login-card h1{text-align:center;margin:0 0 4px;font-size:24px}
.login-card .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 16px}
.login-card .badge-mode{display:block;text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px}

/* ---------- toast ---------- */
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0f172a;color:#fff;padding:11px 17px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:60;max-width:88vw;font-size:13px;font-weight:600;text-align:center}
#toast.on{display:block}
#toast.ok{background:var(--acD)}

/* ---------- responsive ---------- */
@media(max-width:760px){
  .screen table:not(.gw table){display:block;overflow-x:auto;white-space:nowrap}
  .filters select,.filters input{max-width:none;flex:1 1 42%}
  .stat b{font-size:17px}
  .row{flex-wrap:wrap}
}
@media(min-width:900px){
  .screen{padding:18px 20px 80px}
}
@media print{
  .topbar,.nav,.bar,.filters,.acts,#toast{display:none!important}
  .screen{padding:0;max-width:none}
  body{background:#fff}
  table{font-size:11px}
}
</style>
</head>
<body>
<header id="hdr" class="topbar"></header>
<div id="nav" class="nav"></div>
<main><div id="screen" class="screen"></div></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/accounting.js"></script>
<script src="js/views-people.js"></script>
<script src="js/views-money.js"></script>
<script src="js/views-reports.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
